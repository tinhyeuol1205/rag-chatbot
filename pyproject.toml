[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Internal RAG Chatbot — Advanced RAG techniques showcase"
authors = [{ name = "Binh DV" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core utilities
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<27",

    # LLM (OpenAI-compatible + Google Gemini)
    "openai>=1.30,<3",
    "google-genai==2.15.0",

    # Embeddings + Reranker (local)
    "sentence-transformers>=3.0,<6",

    # Vector Database
    "qdrant-client>=1.9,<2",

    # Document parsing (PDF, DOCX, MD)
    "unstructured[pdf,docx,md]>=0.14,<0.25",

    # Text splitting
    "langchain-text-splitters>=0.2,<0.4",

    # Sparse search (BM25 keyword matching)
    "rank-bm25>=0.2,<0.3",

    # API server
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2.0,<4",

    # Chat UI
    "gradio>=4.0,<7",

    # Evaluation (RAG metrics)
    "ragas>=0.2,<0.5",
    "langchain-openai>=0.2,<1",
    "langchain-huggingface>=0.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Project là app (code nằm trong src/{core,ingestion,...}), không phải library để publish.
# Báo uv đừng build wheel — tránh lỗi "Unable to determine which files to ship".
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
